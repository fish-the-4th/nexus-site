<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Page not found - Nexus</title>
<style>
  :root { --bg:#15161c; --raised:#1c1e26; --line:#2a2c38; --text:#e6e7ec; --muted:#8b8d9c; --blurple:#5865F2; --blurple-dark:#4752c4; --cyan:#4fc3e0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 28px 20px;
    background: var(--bg); color: var(--text); line-height: 1.6; -webkit-font-smoothing: antialiased;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  main { width: 100%; max-width: 560px; text-align: center; }
  .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 22px; }
  .code { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: var(--cyan); }
  h1 { font-size: 24px; font-weight: 700; margin: 12px 0 8px; }
  p { color: var(--muted); font-size: 15px; }
  .suggest {
    display: none; margin: 22px 0 0; padding: 14px 16px; text-align: left; font-size: 14px;
    border: 1px solid var(--line); border-left: 3px solid var(--cyan); background: var(--raised); border-radius: 8px; color: #c4c6d1;
  }
  .suggest a { color: var(--cyan); word-break: break-all; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .links a {
    display: block; padding: 12px 14px; border: 1px solid var(--line); background: var(--raised);
    border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14.5px; font-weight: 600;
  }
  .links a small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .links a:hover, .links a:focus-visible { border-color: var(--cyan); outline: none; }
  .links a.primary { background: var(--blurple); border-color: var(--blurple); grid-column: 1 / -1; }
  .links a.primary:hover { background: var(--blurple-dark); border-color: var(--blurple-dark); }
  .links a.primary small { color: rgba(255,255,255,.8); }
  @media (max-width: 420px) { .links { grid-template-columns: 1fr; } .code { font-size: 52px; } }
</style>
</head>
<body>
<main>
  <img class="logo" id="logo" alt="" width="64" height="64">
  <div class="code">404</div>
  <h1>That page doesn't exist</h1>
  <p>The address may have a typo, or the page may have moved.</p>

  <div class="suggest" id="suggest"></div>

  <div class="links" id="links">
    <a class="primary" data-to="Website/index.html">Go to the Nexus home page<small>Start from the beginning</small></a>
    <a data-to="Website/docs.html">Docs<small>Guides and setup</small></a>
    <a data-to="Website/commands.html">Commands<small>Search every command</small></a>
    <a data-to="Website/status.html">Status<small>Is Nexus online?</small></a>
    <a data-to="Website/faq.html">FAQ<small>Common questions</small></a>
  </div>
</main>

<script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = (location.hostname.slice(-10) === '.github.io' && parts.length) ? '/' + parts[0] + '/' : '/';
    document.getElementById('logo').src = base + 'logo.png';
    document.querySelectorAll('#links a').forEach(function (a) { a.href = base + a.getAttribute('data-to'); });
    var known = ['about', 'docs', 'commands', 'changelog', 'faq', 'privacy', 'status', 'staff', 'retired'];
    var rest = location.pathname.slice(base.length).replace(/\/+$/, '');
    var name = rest.split('/').pop().replace(/\.html?$/i, '').toLowerCase();
    if (known.indexOf(name) !== -1 && rest.toLowerCase().indexOf('website/') !== 0) {
      var target = base + 'Website/' + name + '.html';
      var box = document.getElementById('suggest');
      var label = name.charAt(0).toUpperCase() + name.slice(1);
      box.innerHTML = 'Looking for the ' + label + ' page? It lives at <a href="' + target + '"></a>';
      var link = box.querySelector('a');
      link.textContent = location.origin + target;
      box.style.display = 'block';
    }
  })();
</script>
</body>
</html>
