<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Nexus</title>
<script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = (location.hostname.slice(-10) === '.github.io' && parts.length) ? '/' + parts[0] + '/' : '/';
    location.replace(base + 'Website/index.html');
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #15161c; color: #e6e7ec; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  a { color: #4fc3e0; }
</style>
</head>
<body>
<p>Taking you to the Nexus home page. <a id="home" href="#">Click here if nothing happens.</a></p>
<script>
  (function () {
    var parts = location.pathname.split('/').filter(Boolean);
    var base = (location.hostname.slice(-10) === '.github.io' && parts.length) ? '/' + parts[0] + '/' : '/';
    document.getElementById('home').href = base + 'Website/index.html';
  })();
</script>
</body>
</html>
